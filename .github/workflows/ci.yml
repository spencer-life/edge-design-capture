name: Validate extension
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Syntax, manifest, safety invariants and unit tests
        run: npm run check && npm test && git diff --check
      - name: Install test-only browser tooling
        if: ${{ !github.event.pull_request.draft }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xdotool xvfb
          npm install --prefix /tmp/design-lens-audit --ignore-scripts --no-package-lock axe-core@4.14.0
      - name: Real DOM and UI harness
        if: ${{ !github.event.pull_request.draft }}
        run: .venv/bin/python tests/browser.py
      - name: Native extension, screenshots, downloads, storage and axe
        if: ${{ !github.event.pull_request.draft }}
        env:
          AXE_PATH: /tmp/design-lens-audit/node_modules/axe-core/axe.min.js
        run: xvfb-run -a -s '-screen 0 1800x1200x24' .venv/bin/python tests/native.py
      - name: Build reproducible packages and record revision
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/tested-commit.txt
          DESIGN_LENS_REVISION="$(git rev-parse HEAD)" npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: design-lens-validation-${{ github.run_id }}
          path: |
            test-results/
            dist/
          if-no-files-found: error
          retention-days: 14
